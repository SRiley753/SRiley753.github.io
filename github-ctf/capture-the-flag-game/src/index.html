<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Capture the Flag Game</title>
    <link rel="stylesheet" href="styles/style.css">
</head>
<body>
    <header>
        <h1>Capture the Flag Game</h1>
        <p>Answer the questions to receive clues and progress through the game!</p>
    </header>
    <main>
        <section id="question-section">
            <h2 id="question">Question will appear here</h2>
            <input type="text" id="answer-input" placeholder="Type your answer here">
            <button id="submit-answer">Submit Answer</button>
        </section>
        <section id="clue-section">
            <h3>Clue:</h3>
            <p id="clue">Clue will appear here after answering correctly.</p>
        </section>
    </main>
    <footer>
        <p>&copy; 2023 Capture the Flag Game</p>
    </footer>
    <script src="scripts/app.js"></script>
</body>
</html>
